name: TikTok Ads production checks

on:
  pull_request:
    paths:
      - ".github/workflows/tiktok-ads-production.yml"
      - "apphosting.yaml"
      - "firebase.json"
      - "firestore.indexes.json"
      - "src/firestore.rules"
      - "package.json"
      - "package-lock.json"
      - "src/app/api/marketing/tiktok-ads/**"
      - "src/app/auth/tiktok-ads/**"
      - "src/components/properties/detail/actions/TikTokAdsCard.tsx"
      - "src/lib/tiktok-ads.ts"
      - "src/lib/tiktok-ads/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tiktok-ads-production.yml"
      - "apphosting.yaml"
      - "firebase.json"
      - "firestore.indexes.json"
      - "src/firestore.rules"
      - "package.json"
      - "package-lock.json"
      - "src/app/api/marketing/tiktok-ads/**"
      - "src/app/auth/tiktok-ads/**"
      - "src/components/properties/detail/actions/TikTokAdsCard.tsx"
      - "src/lib/tiktok-ads.ts"
      - "src/lib/tiktok-ads/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktok-ads-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run TikTok Ads deterministic tests
        run: npm run test:tiktok-ads -- --reporter=dot

      - name: Run Firestore Rules integration tests
        run: npm run test:tiktok-ads:rules

      - name: Run strict TikTok Ads lint
        run: npm run lint:tiktok-ads

      - name: Run repository typecheck
        run: npm run typecheck

      - name: Build production application
        run: npm run build
