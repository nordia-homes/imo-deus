# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 4
  maxInstances: 10

env:
  - variable: OLX_PHONE_BROWSER_URL
    value: "https://olx-phone-browser-lz5qfusjya-uc.a.run.app"
    availability:
      - RUNTIME

  - variable: BROWSERBASE_API_KEY
    secret: BROWSERBASE_API_KEY
    availability:
      - RUNTIME

  - variable: BROWSERBASE_PROJECT_ID
    secret: BROWSERBASE_PROJECT_ID
    availability:
      - RUNTIME

  - variable: BROWSERBASE_EXTENSION_ID
    secret: BROWSERBASE_EXTENSION_ID
    availability:
      - RUNTIME

  - variable: BROWSERBASE_REGION
    value: "eu-central-1"
    availability:
      - RUNTIME

  - variable: BROWSERBASE_PROXY_COUNTRY
    value: "RO"
    availability:
      - RUNTIME

  - variable: BROWSERBASE_USE_PROXY
    value: "false"
    availability:
      - RUNTIME

  - variable: FACEBOOK_CLOUD_RUNNER_URL
    secret: FACEBOOK_CLOUD_RUNNER_URL
    availability:
      - RUNTIME

  - variable: FACEBOOK_CLOUD_RUNNER_TOKEN
    secret: FACEBOOK_CLOUD_RUNNER_TOKEN
    availability:
      - RUNTIME

  - variable: FACEBOOK_CLOUD_RUNNER_CALLBACK_TOKEN
    secret: FACEBOOK_CLOUD_RUNNER_CALLBACK_TOKEN
    availability:
      - RUNTIME

  - variable: PLAYWRIGHT_BROWSERS_PATH
    value: "0"
    availability:
      - BUILD
      - RUNTIME

  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME

  - variable: OWNER_LISTINGS_CRON_SECRET
    secret: OWNER_LISTINGS_CRON_SECRET
    availability:
      - RUNTIME

  - variable: VAPI_API_KEY
    secret: VAPI_API_KEY
    availability:
      - RUNTIME

  - variable: VAPI_WEBHOOK_SECRET
    secret: VAPI_WEBHOOK_SECRET
    availability:
      - RUNTIME

  - variable: AI_CALLS_DEFAULT_VAPI_ASSISTANT_ID
    secret: AI_CALLS_DEFAULT_VAPI_ASSISTANT_ID
    availability:
      - RUNTIME

  - variable: AI_CALLS_DEFAULT_VAPI_PHONE_NUMBER_ID
    secret: AI_CALLS_DEFAULT_VAPI_PHONE_NUMBER_ID
    availability:
      - RUNTIME

  - variable: AI_OUTREACH_CRON_SECRET
    secret: AI_OUTREACH_CRON_SECRET
    availability:
      - RUNTIME

  - variable: PROPERTY_VIDEO_TOUR_CRON_SECRET
    secret: PROPERTY_VIDEO_TOUR_CRON_SECRET
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: studio-652232171-42fb6.firebasestorage.app
    availability:
      - RUNTIME

  - variable: PROPERTY_VIDEO_TOUR_AVATAR_PROVIDER
    value: agent_photo
    availability:
      - RUNTIME

  - variable: OPENAI_TTS_MODEL
    value: gpt-4o-mini-tts
    availability:
      - RUNTIME

  - variable: OPENAI_ASSISTANT_MODEL
    value: gpt-4.1-mini
    availability:
      - RUNTIME
